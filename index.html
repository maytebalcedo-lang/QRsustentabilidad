<title>Gota arriba texto visible</title>
<style>
html,body{margin:0;padding:0;background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;}
.poster{position:relative;width:1024px;height:1536px;max-width:100vw;max-height:100vh;}
.poster img{width:100%;height:100%;object-fit:contain;display:block;}
.drop{
 position:absolute;
 left:50%;
 top:5.5%;
 width:38%;
 height:32%;
 transform:translateX(-50%);
}
.drop svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 8px 18px rgba(0,0,0,0.18));}
.timer{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);color:white;font-weight:900;font-size:36px;text-shadow:0 2px 0 #0a4a2a,0 4px 12px rgba(0,0,0,0.5);-webkit-text-stroke:1.4px #0a4a2a;tabular-nums:true;}
.msg{position:absolute;left:50%;top:80%;transform:translate(-50%,-50%) scale(.8);background:white;color:#0a4a2a;font-weight:800;font-size:16px;padding:5px 12px;border-radius:999px;white-space:nowrap;opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1);}
.msg.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
@media(max-width:1024px){.poster{width:100vw;height:auto;aspect-ratio:1024/1536;}.timer{font-size:clamp(18px,4vw,36px);}.msg{font-size:clamp(11px,2vw,16px);}}
</style></head>
